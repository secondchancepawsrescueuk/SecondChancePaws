<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Second Chance Paws</title>
<style>*{box-sizing:border-box;font-family:Arial}body{background:#f5f5f5;margin:0;padding:20px}.box{max-width:500px;margin:40px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}h1{color:#e67e22;text-align:center}input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}button{background:#e67e22;color:white;border:none;padding:12px;border-radius:8px;width:100%;cursor:pointer;font-weight:bold}button:hover{background:#d35400}.hidden{display:none}</style></head>
<body>
<div id="loginBox" class="box"><h1>🐾 Admin Login</h1><input type="password" id="pw" placeholder="Password"><button onclick="login()">Login</button><p id="err" style="color:red;text-align:center"></p><p style="font-size:12px;color:#999;text-align:center">Default: Rescue2026</p></div>
<div id="panel" class="box hidden"><h1>🐶 Add Dogs</h1><input id="name" placeholder="Dog Name"><input id="age" placeholder="Age"><input id="breed" placeholder="Breed"><input id="img" placeholder="Image URL"><textarea id="desc" placeholder="Description"></textarea><button onclick="addDog()">Add Dog</button><div id="list" style="margin-top:20px"></div><p><a href="index.html">View Website →</a></p><button onclick="logout()" style="background:#c0392b;margin-top:20px">Logout</button></div>
<script>
const DEF="Rescue2026";let dogs=JSON.parse(localStorage.getItem('rescueDogs')||'[]');
function login(){let p=document.getElementById('pw').value;let s=localStorage.getItem('adminPass')||DEF;if(p===s){localStorage.setItem('isAdmin','true');show()}else{document.getElementById('err').innerText='Wrong password!';}}
function show(){document.getElementById('loginBox').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');render();}
function logout(){localStorage.removeItem('isAdmin');location.reload();}
function addDog(){let n=document.getElementById('name').value;if(!n)return alert('Name required');let d={name:n,age:document.getElementById('age').value,breed:document.getElementById('breed').value,image:document.getElementById('img').value||'https://placedog.net/400/300?id='+(dogs.length+1),desc:document.getElementById('desc').value,id:Date.now()};dogs.push(d);localStorage.setItem('rescueDogs',JSON.stringify(dogs));document.getElementById('name').value='';render();alert('Added!');}
function render(){document.getElementById('list').innerHTML=dogs.map(x=>`<div style="border:1px solid #eee;padding:10px;margin:5px 0;border-radius:8px"><b>${x.name}</b> - ${x.breed} <button onclick="dogs=dogs.filter(a=>a.id!=${x.id});localStorage.setItem('rescueDogs',JSON.stringify(dogs));render()" style="background:red;width:auto;padding:2px 8px;float:right">X</button></div>`).join('')||'No dogs yet';}
if(localStorage.getItem('isAdmin')==='true')show();
</script>
</body></html>
