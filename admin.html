<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin - Second Chance Paws UK</title><style>body{font-family:Arial;background:#111;color:white;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh}.box{max-width:700px;width:100%;background:white;color:#333;padding:25px;border-radius:12px}input,textarea,select{width:100%;padding:11px;margin:7px 0;border:1px solid #ccc;border-radius:6px}button{width:100%;padding:13px;background:#ff6b35;color:white;border:none;border-radius:6px;font-size:17px;cursor:pointer;margin-top:8px;font-weight:bold}.login-box{max-width:400px;width:100%;background:white;color:#333;padding:25px;border-radius:12px}.hidden{display:none}</style></head><body><div id="loginScreen" class="login-box"><h2 style="text-align:center">ADMIN LOGIN<br>Second Chance Paws UK</h2><input type="text" id="username" placeholder="Username"><input type="password" id="password" placeholder="Password"><button onclick="login()">Login</button><p style="font-size:12px;margin-top:12px;background:#fff3cd;padding:10px;border-radius:6px"><b>Login:</b> admin / RescueUK2026!</p><p style="text-align:center"><a href="index.html">Back</a></p></div><div id="adminScreen" class="box hidden"><h2>LOGGED IN</h2><p><a href="#" onclick="logout()" style="color:red">Logout</a></p><input type="text" id="name" placeholder="Pet Name"><input type="text" id="age" placeholder="Age & Price"><textarea id="desc" rows="3" placeholder="Description"></textarea><input type="text" id="img" placeholder="Image URL"><input type="text" id="tags" placeholder="Tags"><select id="city"><option>London</option><option>Birmingham</option><option>Manchester</option><option>Leeds</option><option>Liverpool</option><option>Bristol</option></select><button onclick="createPost()">Create Post</button><div id="list"></div><p style="text-align:center"><a href="index.html" style="color:#ff6b35">VIEW WEBSITE</a></p></div><script>
const u="admin";const p="RescueUK2026!";
function login(){let a=document.getElementById("username").value;let b=document.getElementById("password").value;if(a===u&&b===p){localStorage.setItem("scpr_logged","yes");showAdmin();}else alert("Wrong!");}
function logout(){localStorage.removeItem("scpr_logged");location.reload();}
function showAdmin(){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("adminScreen").classList.remove("hidden");load();}
function checkLogin(){if(localStorage.getItem("scpr_logged")==="yes")showAdmin();}
function load(){let arr=JSON.parse(localStorage.getItem("scpr_pets")||"[]");let list=document.getElementById("list");list.innerHTML="";arr.forEach((x,i)=>{let d=document.createElement("div");d.style="background:#f9f9f9;padding:8px;margin:5px 0;border-radius:6px;display:flex;justify-content:space-between";d.innerHTML="<div><b>"+x.name+"</b></div><button onclick=\"del("+i+")\" style=\"width:auto;padding:4px 9px;background:#dc3545\">X</button>";list.appendChild(d);});}
function createPost(){let n=document.getElementById("name").value;if(!n)return alert("Enter name");let pet={name:n,age:document.getElementById("age").value||"UK - 350 + 170 Deposit",desc:document.getElementById("desc").value||"Lovely rescue",img:document.getElementById("img").value||"https://images.unsplash.com/photo-1552053831-71594a27632d?w=500",tags:document.getElementById("tags").value||"350 + DEPOSIT",city:document.getElementById("city").value};let arr=JSON.parse(localStorage.getItem("scpr_pets")||"[]");arr.push(pet);localStorage.setItem("scpr_pets",JSON.stringify(arr));load();alert(n+" CREATED!");}
function del(i){let arr=JSON.parse(localStorage.getItem("scpr_pets")||"[]");arr.splice(i,1);localStorage.setItem("scpr_pets",JSON.stringify(arr));load();}
checkLogin();
</script></body></html>
