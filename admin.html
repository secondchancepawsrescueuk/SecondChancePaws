<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Second Chance Paws</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{background:#f0f7f0;padding:20px}
.box{max-width:500px;margin:40px auto;background:white;padding:30px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.1)}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd}
button{background:#2d6a4f;color:white;border:none;font-weight:bold;cursor:pointer}
.hidden{display:none}
.dog{background:#f9f9f9;padding:10px;margin:10px 0;border-radius:8px}
</style>
</head>
<body>
<div id="loginBox" class="box"><h1>🐾 Admin Login</h1><input type="password" id="pass" placeholder="Password"><button onclick="login()">Login</button><p id="msg"></p></div>
<div id="panel" class="box hidden"><h1>🐶 Add Dog</h1><input id="dogName" placeholder="Dog Name"><input id="dogImg" placeholder="Image URL"><input id="dogAge" placeholder="Age"><textarea id="dogDesc" placeholder="Description" style="width:100%;padding:12px"></textarea><button onclick="addDog()">Add Dog</button><button onclick="logout()" style="background:#999">Logout</button><div id="list"></div></div>
<script>
const DEF="Rescue2026";let dogs=JSON.parse(localStorage.getItem('dogs')||'[]');
function login(){let p=document.getElementById('pass').value;if(p===DEF){localStorage.setItem('isAdmin','true');show()}else{document.getElementById('msg').innerText='Wrong password'}}
function show(){document.getElementById('loginBox').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');render()}
function logout(){localStorage.removeItem('isAdmin');location.reload()}
function addDog(){let n=document.getElementById('dogName').value;let i=document.getElementById('dogImg').value;let a=document.getElementById('dogAge').value;let d=document.getElementById('dogDesc').value;if(!n)return alert('Name needed');dogs.push({name:n,img:i,age:a,desc:d});localStorage.setItem('dogs',JSON.stringify(dogs));render();alert('Dog added!')}
function render(){let h='';dogs.forEach((dog,idx)=>{h+=`<div class="dog"><b>${dog.name}</b> - ${dog.age}<br><button onclick="dogs.splice(${idx},1);localStorage.setItem('dogs',JSON.stringify(dogs));render()">Delete</button></div>`});document.getElementById('list').innerHTML=h}
if(localStorage.getItem('isAdmin')==='true'){show()}
</script>
</body>
</html>
